<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="注册福溪村官网账号，参与村务交流">
  <title>注册 - 福溪村</title>

  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/common/reset.css">
  <link rel="stylesheet" href="/css/common/variables.css">
  <link rel="stylesheet" href="/css/common/typography.css">
  <link rel="stylesheet" href="/css/common/utilities.css">
  <link rel="stylesheet" href="/css/components/form.css">
  <link rel="stylesheet" href="/css/pages/login.css">
  <script src="/js/common/theme-loader.js"></script>
  <style>
    /* Turnstile 加载和错误状态 */
    .turnstile-loading {
      text-align: center;
      padding: 20px;
      color: var(--color-text-secondary);
      font-size: var(--font-size-sm);
      background: var(--color-bg-page);
      border-radius: var(--radius-md);
      border: 1px dashed var(--color-border);
    }

    .turnstile-error {
      text-align: center;
      padding: 16px;
      background: #fff3e0;
      border-radius: var(--radius-md);
      border: 1px solid #ffcc80;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .turnstile-error__icon {
      font-size: 24px;
    }

    .turnstile-error__text {
      color: #e65100;
      font-size: var(--font-size-sm);
    }

    .turnstile-retry {
      margin-top: 4px;
      padding: 6px 16px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .turnstile-retry:hover {
      background: var(--color-primary-dark);
    }

    .turnstile-success {
      border: 2px solid #4caf50;
      border-radius: var(--radius-md);
      padding: 2px;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-logo">福溪村</h1>
        <p class="auth-subtitle">用户注册</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" name="username" class="form-input" placeholder="3-20字符，字母、数字、-、_" autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" name="phone" class="form-input" placeholder="请输入手机号" autocomplete="tel">
        </div>

        <div class="form-group">
          <label class="form-label">邮箱（选填）</label>
          <input type="email" name="email" class="form-input" placeholder="请输入邮箱" autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" name="password" class="form-input" placeholder="请输入密码（不少于8位）" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input type="password" name="passwordConfirm" class="form-input" placeholder="请再次输入密码" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" name="agree">
            <span>我已阅读并同意<a href="/terms.html" target="_blank">用户协议</a>和<a href="/privacy.html" target="_blank">隐私政策</a></span>
          </label>
        </div>

        <div class="turnstile-container" id="turnstile-container"></div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="btn-register">注册</button>
      </form>

      <div class="auth-footer">
        已有账号？<a href="/login.html" class="auth-link">立即登录</a>
      </div>
    </div>

    <a href="/" class="auth-back">&larr; 返回首页</a>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/storage.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/toast.js"></script>
  <script src="/js/components/form.js"></script>
  <script src="/js/pages/register.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
